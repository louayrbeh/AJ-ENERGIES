name: Deploy AJ ENERGIES to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      # These are public browser parameters, never Gmail/SMTP secrets.
      EMAILJS_ENABLED: ${{ vars.EMAILJS_ENABLED || 'false' }}
      EMAILJS_PUBLIC_KEY: ${{ vars.EMAILJS_PUBLIC_KEY }}
      EMAILJS_SERVICE_ID: ${{ vars.EMAILJS_SERVICE_ID }}
      EMAILJS_CONTACT_TEMPLATE_ID: ${{ vars.EMAILJS_CONTACT_TEMPLATE_ID }}
      EMAILJS_QUOTE_TEMPLATE_ID: ${{ vars.EMAILJS_QUOTE_TEMPLATE_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Read assigned Pages URL
        id: pages
        uses: actions/configure-pages@v5
      - name: Test contact modules without sending messages
        run: npm test
      - name: Build and verify production artifact
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npm run build
          npm run check
          node scripts/check-pages.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
